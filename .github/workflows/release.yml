name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e .
          pip install pytest
          python -m pytest tests/ -q

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow flask requests cryptography psutil watchdog Pillow
          pip install -e .
      - name: Build executables
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name CanaryGuard --collect-submodules canaryguard main.py
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name CanaryGuardApp --collect-submodules canaryguard guardapp.py
      - name: Build installer (Inno Setup, if present)
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)
          if (-not $iscc) { $candidate = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"; if (Test-Path $candidate) { $iscc = $candidate } }
          if ($iscc) { & $iscc packaging\windows\CanaryGuard.iss } else { Write-Host "Inno Setup not found - skipping installer, exes only" }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canaryguard-windows
          path: |
            dist/CanaryGuard.exe
            dist/CanaryGuardApp.exe
            dist/CanaryGuard-Setup-*.exe
          if-no-files-found: error

  publish:
    needs: [test, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: canaryguard-windows
          path: release-files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Collect python packages
        run: cp dist/*.tar.gz dist/*.whl release-files/ || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
